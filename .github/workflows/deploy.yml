name: Deploy To GCE VM

on:
  push:
    branches:
      - temp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 GCE VM에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          APPLICATION_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES }} # GitHub Secrets에 저장
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_PRIVATE_KEY }}
          envs: APPLICATION_PROPERTIES
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.GCE_USERNAME }}/exerciseRecordService

            # (선택) 브랜치 보장
            git fetch origin
            git checkout temp
            git pull --ff-only origin temp

            # application.properties 적용 (GitHub Secret에서 내려쓰기)
            mkdir -p src/main/resources
            printf "%s" "$APPLICATION_PROPERTIES" > src/main/resources/application.properties

            # gradlew 권한 보장 후 빌드
            chmod +x ./gradlew || true
            ./gradlew clean build -x test

            # 이전 HTTPS(443) 프로세스 종료 (있으면)
            sudo fuser -k -n tcp 443 || true

            # (선택) 자바에 443 바인딩 권한 부여 - 비root 실행할 때만 필요
            # sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(which java)")" || true

            # keystore 읽기 + 443 바인딩을 위해 sudo로 실행
            # 필요시 JDK/JRE 경로 조정
            sudo nohup java -jar build/libs/*SNAPSHOT.jar > ./output.log 2>&1 &

            # 배포 검증 (최대 10번, 2초 간격)
            for i in {1..10}; do
              if curl -skI https://xn--2y5bw4a.site | grep -qE '^HTTP/.* (200|301|302)'; then
                echo "HTTPS health check OK"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            exit 1