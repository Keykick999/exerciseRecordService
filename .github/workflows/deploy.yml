name: Deploy To GCE VM

on:
  push:
    branches:
      - temp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 GCE VM에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          APPLICATION_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES }} # GitHub Secrets에 저장
        with:
          host: ${{ secrets.GCE_HOST }}          # GCE VM 외부 IP
          username: ${{ secrets.GCE_USERNAME }}  # GCE VM 접속 username
          key: ${{ secrets.GCE_PRIVATE_KEY }}    # 개인키(id_rsa) 내용
          envs: APPLICATION_PROPERTIES           # 위 env를 원격 세션으로 전달
          script_stop: true                      # 아래 명령어 중 실패 시 전체 실패
          script: |
            set -e
            cd /home/${{ secrets.GCE_USERNAME }}/exerciseRecordService

            # (선택) 브랜치 보장
            git fetch origin
            git checkout temp
            git pull --ff-only origin temp

            # application.properties 적용
            # 줄바꿈/특수문자 보존을 위해 printf 권장
            mkdir -p src/main/resources
            printf "%s" "$APPLICATION_PROPERTIES" > src/main/resources/application.properties

            # gradlew 권한 보장 후 빌드
            chmod +x ./gradlew || true
            ./gradlew clean build -x test

            # 기존 프로세스 종료 (없어도 실패 처리하지 않음)
            sudo fuser -k -n tcp 8080 || true

            # 새 JAR 실행
            nohup java -jar build/libs/*SNAPSHOT.jar > ./output.log 2>&1 &
