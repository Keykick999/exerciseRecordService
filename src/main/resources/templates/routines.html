<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Routines</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .dark-mode {
            background: #121212 !important;
            color: #e0e0e0;
        }

        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }

        .navbar-nav .nav-link {
            color: #ffffff !important;
        }

        .navbar-nav .nav-link:hover {
            color: #ccccff !important;
        }

        .navbar {
            background-color: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 2rem;
            border-radius: 1rem;
            margin-top: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
        }

        .dark-mode .container {
            background-color: rgba(40, 40, 40, 0.95);
        }

        h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        #loader {
            color: #cccccc;
            font-weight: 500;
        }

        .routine-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s;
        }

        .routine-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card-text {
            color: #cccccc !important;
        }

        .btn-outline-primary,
        .btn-outline-danger {
            border-radius: 0.5rem;
            font-weight: 500;
            color: #ffffff;
            border-color: #888;
            transition: 0.2s ease;
        }

        .btn-outline-primary:hover {
            background-color: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            color: #fff;
            border-color: #dc3545;
        }

        /* ✅ 다크모드 토글 버튼 */
        #darkModeToggle {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 1000;
            border: none;
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #darkModeToggle:hover {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<!-- 네비게이션 바 -->
<div th:replace="fragments/navbar :: body"></div>

<!-- ✅ 본문 -->
<div class="container my-5">
    <h2 class="mb-4 text-center fw-bold">나의 운동 루틴</h2>
    <div id="routineContainer" class="row g-4"></div>
    <div class="text-center mt-4" id="loader">Loading...</div>
</div>


<script src="/js/auth.js"></script>
<script>
    let page = 0;
    const size = 10;
    let isLoading = false;
    let isLastPage = false;

    function loadRoutines() {
        if (isLoading || isLastPage) return;
        isLoading = true;

        $.ajax({
            url: `/api/routines?page=${page}&size=${size}`,
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
            },
            success: function (data) {
                const container = $('#routineContainer');

                data.content.forEach(routine => {
                    const html = `
                        <div class="col-md-6 col-lg-4" id="routine-${routine.id}">
                            <div class="card routine-card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title">${routine.name}</h5>
                                        <p class="card-text text-muted">생성일: ${new Date(routine.createdAt).toLocaleString()}</p>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <button class="btn btn-outline-primary" onclick="goToDetail('${routine.name}', ${routine.id})">루틴 보기</button>
                                        <button class="btn btn-outline-danger" onclick="deleteRoutine(${routine.id})">삭제</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.append(html);
                });

                if (data.last) {
                    isLastPage = true;
                    $('#loader').text('모든 루틴을 불러왔습니다.');
                } else {
                    page += 1;
                }

                isLoading = false;
            },
            error: function (xhr) {
                console.error('루틴 조회 실패:', xhr);
                if (xhr.status === 401 || xhr.status === 403) {
                    alert('로그인이 필요합니다.');
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login';
                } else {
                    $('#loader').text('루틴을 불러오지 못했습니다.');
                }
                isLoading = false;
            }
        });
    }

    function goToDetail(name, id) {
        const encodedName = encodeURIComponent(name);
        window.location.href = `routine-detail.html?name=${encodedName}&routineId=${id}`;
    }

    function logout() {
        localStorage.removeItem('accessToken');
        alert("로그아웃 되었습니다.");
        window.location.href = '/login';
    }


    // 무한 스크롤
    $(window).on('scroll', function () {
        if ($(window).scrollTop() + $(window).height() >= $(document).height() - 50) {
            loadRoutines();
        }
    });

    // 루틴 삭제
    function deleteRoutine(routineId) {
        if (!confirm("정말 이 루틴을 삭제하시겠습니까?")) return;

        $.ajax({
            url: `/api/routines/${routineId}`,
            type: 'DELETE',
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
            },
            success: function () {
                alert("루틴이 삭제되었습니다.");
                $(`#routine-${routineId}`).remove();
            },
            error: function (xhr) {
                if (xhr.status === 401 || xhr.status === 403) {
                    alert('로그인 후 이용해 주세요.');
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login.html';
                }
                else {
                    alert("루틴 삭제 중 오류가 발생했습니다.");
                }
            }
        });
    }

    $(document).ready(function () {
        renderAuthMenu();
        loadRoutines();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
