<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인/회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1579758629938-03607ccdbaba?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            background-color: rgba(0, 0, 0, 0.85); /* 더 진한 배경 투명도 */
            backdrop-filter: blur(12px); /* 더 강한 블러 효과 */
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            color: white;
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.8rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .form-floating > label {
            color: #cccccc;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 0.5rem;
        }

        .form-control::placeholder {
            color: #bbbbbb;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-weight: bold;
            border-radius: 0.6rem;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.4);
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            color: #bbbbbb;
        }

        .auth-switch a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <!-- 로그인 폼 -->
    <div id="loginForm">
        <h2>로그인</h2>
        <div class="form-group">
            <div class="form-floating">
                <input type="text" class="form-control" id="loginUsername" placeholder="아이디">
                <label for="loginUsername">아이디</label>
            </div>
            <div id="loginUsernameError" class="error-message"></div>
        </div>
        <div class="form-group">
            <div class="form-floating">
                <input type="password" class="form-control" id="loginPassword" placeholder="비밀번호">
                <label for="loginPassword">비밀번호</label>
            </div>
            <div id="loginPasswordError" class="error-message"></div>
        </div>
        <button class="btn btn-primary" onclick="login()">로그인</button>
        <div class="auth-switch">
            계정이 없으신가요? <a onclick="toggleForms()">회원가입</a>
        </div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="registerForm" style="display: none;">
        <h2>회원가입</h2>
        <div class="form-group">
            <div class="form-floating">
                <input type="text" class="form-control" id="registerUsername" placeholder="아이디">
                <label for="registerUsername">아이디</label>
            </div>
            <div id="registerUsernameError" class="error-message"></div>
        </div>
        <div class="form-group">
            <div class="form-floating">
                <input type="password" class="form-control" id="registerPassword" placeholder="비밀번호">
                <label for="registerPassword">비밀번호</label>
            </div>
            <div id="registerPasswordError" class="error-message"></div>
        </div>
        <div class="form-group">
            <div class="form-floating">
                <input type="password" class="form-control" id="registerPasswordConfirm" placeholder="비밀번호 확인">
                <label for="registerPasswordConfirm">비밀번호 확인</label>
            </div>
            <div id="registerPasswordConfirmError" class="error-message"></div>
        </div>
        <div class="form-group">
            <div class="form-floating">
                <input type="email" class="form-control" id="registerEmail" placeholder="이메일">
                <label for="registerEmail">이메일</label>
            </div>
            <div id="registerEmailError" class="error-message"></div>
        </div>
        <button class="btn btn-primary" onclick="register()">회원가입</button>
        <div class="auth-switch">
            이미 계정이 있으신가요? <a onclick="toggleForms()">로그인</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function clearErrors() {
        $('.error-message').hide().text('');
    }

    function toggleForms() {
        clearErrors();
        $('#loginForm').toggle();
        $('#registerForm').toggle();
    }

    function login() {
        clearErrors();
        const username = $('#loginUsername').val();
        const password = $('#loginPassword').val();
        let hasError = false;

        if (!username) {
            $('#loginUsernameError').text('아이디를 입력해주세요.').show();
            hasError = true;
        }
        if (!password) {
            $('#loginPasswordError').text('비밀번호를 입력해주세요.').show();
            hasError = true;
        }
        if (hasError) return;

        $.ajax({
            url: '/api/users/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username, password }),
            success: function(response) {
                localStorage.setItem('jwtToken', response);
                window.location.href = '/routine';
            },
            error: function(xhr) {
                if (xhr.status === 401) {
                    $('#loginPasswordError').text('아이디 또는 비밀번호가 올바르지 않습니다.').show();
                } else {
                    $('#loginUsernameError').text('로그인 중 오류가 발생했습니다.').show();
                }
            }
        });
    }

    function register() {
        clearErrors();
        const username = $('#registerUsername').val();
        const password = $('#registerPassword').val();
        const passwordConfirm = $('#registerPasswordConfirm').val();
        const email = $('#registerEmail').val();
        let hasError = false;

        if (!username) {
            $('#registerUsernameError').text('아이디를 입력해주세요.').show();
            hasError = true;
        }
        if (!password) {
            $('#registerPasswordError').text('비밀번호를 입력해주세요.').show();
            hasError = true;
        }
        if (!passwordConfirm) {
            $('#registerPasswordConfirmError').text('비밀번호 확인을 입력해주세요.').show();
            hasError = true;
        }
        if (!email) {
            $('#registerEmailError').text('이메일을 입력해주세요.').show();
            hasError = true;
        }

        if (hasError) return;

        if (password !== passwordConfirm) {
            $('#registerPasswordConfirmError').text('비밀번호가 일치하지 않습니다.').show();
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            $('#registerEmailError').text('올바른 이메일 형식이 아닙니다.').show();
            return;
        }

        $.ajax({
            url: '/api/users/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username, password, email }),
            success: function() {
                alert('회원가입이 완료되었습니다. 로그인해주세요.');
                toggleForms();
            },
            error: function(xhr) {
                if (xhr.status === 409) {
                    $('#registerUsernameError').text('이미 사용 중인 아이디입니다.').show();
                } else {
                    $('#registerUsernameError').text('회원가입 중 오류가 발생했습니다.').show();
                }
            }
        });
    }

    $('#loginUsername, #loginPassword').keypress(function(e) {
        if (e.which === 13) login();
    });

    $('#registerUsername, #registerPassword, #registerPasswordConfirm, #registerEmail').keypress(function(e) {
        if (e.which === 13) register();
    });
</script>
</body>
</html>
