<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>운동 영상 보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .navbar {
            background-color: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }

        .navbar-nav .nav-link {
            color: #ffffff !important;
        }

        .navbar-nav .nav-link:hover {
            color: #ccccff !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 2rem;
            border-radius: 1rem;
            margin-top: 40px;
            max-width: 860px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-select, .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .form-select:focus, .form-control:focus {
            border-color: #66afe9;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(102, 175, 233, 0.25);
        }

        select option {
            background-color: #1e1e1e;
            color: white;
        }

        .video-card {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 0.8rem;
            margin-bottom: 1.5rem;
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 0.8rem;
        }

        .scroll-loader {
            text-align: center;
            color: #aaa;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<!--네비게이션 바-->
<div th:replace="fragments/navbar :: body"></div>

<div class="container">
    <!-- 🔍 필터 영역 -->
    <div class="row mb-3">
        <div class="col-md-3">
            <select id="typeSelect" class="form-select text-white">
                <option value="">영상 유형</option>
                <option value="TUTORIAL">튜토리얼</option>
                <option value="HARD_TRAINING">빡운동</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="muscleInput" class="form-select text-white" multiple>
                <option value="">운동 부위</option>
                <option value="등">등</option>
                <option value="가슴">가슴</option>
                <option value="하체">하체</option>
                <option value="이두">이두</option>
                <option value="삼두">삼두</option>
                <option value="복근">복근</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="exerciseInput" class="form-select text-white" multiple>
                <option value="">운동 종목</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="athleteInput" class="form-select text-white" multiple>
                <option value="">선수명</option>
                <option value="김명섭">김명섭</option>
                <option value="강경원">강경원</option>
                <option value="크리스 범스테드">크리스 범스테드</option>
            </select>
        </div>
    </div>

    <button id="searchBtn" class="btn btn-outline-primary mb-4 w-100">검색</button>
    <button id="resetBtn" class="btn btn-outline-light w-100 mb-2">초기화</button>


    <!-- 📺 영상 리스트 -->
    <div id="videoList"></div>
    <div id="scrollSentinel" class="scroll-loader">🔄 불러오는 중...</div>
</div>

<script src="/js/auth.js"></script>
<script>
    const exerciseMap = {
        "가슴": [
            "플랫 벤치프레스", "인클라인 벤치프레스", "딥스", "플랫 덤벨프레스",
            "인클라인 덤벨프레스", "펙덱 플라이", "푸쉬업", "체스트 프레스"
        ],
        "등": [
            "랫풀다운", "풀업", "친업", "바벨로우", "데드리프트", "원암 덤벨로우"
        ],
        "하체": [
            "스쿼트", "레그프레스", "레스컬", "레그 익스텐션", "핵 스쿼트", "불가리안 스플릿 스쿼트"
        ],
        "이두": ["바벨 컬", "덤벨 컬"],
        "삼두": ["케이블 푸쉬 다운", "라잉 트라이셉스 익스텐션"],
        "복근": ["크런치"]
    };

    $('#muscleInput').on('change', function () {
        const selectedMuscle = $(this).val();
        const exerciseSelect = $('#exerciseInput');
        exerciseSelect.empty();
        exerciseSelect.append('<option value="">운동 종목</option>');
        if (selectedMuscle && exerciseMap[selectedMuscle]) {
            exerciseMap[selectedMuscle].forEach(function (exercise) {
                exerciseSelect.append(`<option value="${exercise}">${exercise}</option>`);
            });
        }
    });

    let currentPage = 0;
    let hasNext = true;
    let isLoading = false;

    function fetchVideos(reset = false) {
        if (isLoading) return;

        if (reset) {
            currentPage = 0;
            hasNext = true;
            $('#videoList').empty();
        }

        if (!hasNext) return;

        isLoading = true;

        const requestBody = {
            type: $('#typeSelect').val() || null,
            muscleGroups: $('#muscleInput').val() || [],
            exerciseNames: $('#exerciseInput').val() || [],
            athleteNames: $('#athleteInput').val() || []
        };


        const token = localStorage.getItem('jwtToken');
        const url = `/api/videos/search?page=${currentPage}&size=6`;

        console.log("🔼 요청 전송:", requestBody);

        $.ajax({
            url,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestBody),
            headers: {
                Authorization: `Bearer ${token}`
            },
            success: function (res) {
                console.log("✅ 응답 받음:", res);
                res.content.forEach(video => {
                    $('#videoList').append(`
                        <div class="video-card">
                            <iframe src="${video.iframeSrc}" frameborder="0" allowfullscreen></iframe>
                            <p class="mt-2 mb-0"><strong>유형:</strong> ${video.type}</p>
                            ${video.details.map(d =>
                        `<small class="text-white-50 d-block">[${d.muscleGroup}] ${d.exerciseName} - ${d.athleteName}</small>`
                    ).join('')}
                        </div>
                    `);
                });

                hasNext = !res.last;
                currentPage++;
                $('#scrollSentinel').text(hasNext ? '🔄 불러오는 중...' : '📦 모든 영상을 불러왔습니다.');
            },
            error: function (xhr) {
                console.error("❌ 오류 응답:", xhr);
                if (xhr.status === 401 || xhr.status === 403) {
                    alert('로그인이 필요합니다.');
                    localStorage.removeItem('jwtToken');
                    location.href = '/login';
                } else {
                    alert('영상 데이터를 불러오는 중 오류가 발생했습니다.');
                }
            },
            complete: function () {
                isLoading = false;
            }
        });
    }

    function resetFilters() {
        $('#typeSelect').val('');
        $('#muscleInput').val([]);
        $('#exerciseInput').empty().append('<option value="">운동 종목</option>');
        $('#athleteInput').val([]);
        fetchVideos(true);
    }


    $(document).ready(function () {
        fetchVideos();

        $('#searchBtn').on('click', function () {
            hasNext = true;
            isLoading = false;
            fetchVideos(true);
        });

        $('#resetBtn').on('click', function () {
            resetFilters();
        });

        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) {
                fetchVideos();
            }
        }, {
            root: null,
            threshold: 0.7
        });

        observer.observe(document.getElementById('scrollSentinel'));
    });
</script>
</body>
</html>
