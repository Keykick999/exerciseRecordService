<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 기록 조회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(6px);
        }
        .navbar-brand { font-weight: bold; color: #00bcd4 !important; }
        .navbar-nav .nav-link { color: #ffffff !important; }
        .navbar-nav .nav-link:hover { color: #ffcc00 !important; }
        .container {
            max-width: 1100px;
            margin: 80px auto;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 42px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }
        .filter-group {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
        }
        .filters label {
            font-size: 16px;
            margin-bottom: 8px;
            color: #eee;
            font-weight: 600;
        }
        .filters input, .filters select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #777;
            background-color: #222;
            color: white;
            font-size: 15px;
        }
        .filters input:focus, .filters select:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 8px #00bcd4;
            outline: none;
        }
        .btn-search {
            padding: 15px 30px;
            font-weight: bold;
            background: linear-gradient(45deg, #00bcd4, #2196f3);
            color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.6);
            transition: 0.2s;
            align-self: center;
        }
        .btn-search:hover {
            background: linear-gradient(45deg, #2196f3, #00bcd4);
        }
        .record-list { margin-top: 40px; }
        .record-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 20px 24px;
            border-radius: 14px;
            margin-bottom: 20px;
            transition: 0.2s;
            cursor: pointer;
        }
        .record-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.01);
        }
        .record-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-info .muscle {
            font-size: 18px;
            color: #ffcc00;
            font-weight: 600;
        }
        .record-info .date {
            font-size: 16px;
            color: #ffffff;
            font-weight: 400;
        }
    </style>
</head>
<body>

<!-- 네비게이션 바 -->
<div th:replace="fragments/navbar :: body"></div>

<div class="container">
    <h1>운동 기록 조회</h1>

    <div class="filters">
        <div class="filter-group">
            <label for="startDate">시작일</label>
            <input type="date" id="startDate">
        </div>
        <div class="filter-group">
            <label for="endDate">종료일</label>
            <input type="date" id="endDate">
        </div>
        <div class="filter-group">
            <label for="exerciseName">운동 이름</label>
            <input type="text" id="exerciseName" placeholder="예: 스쿼트">
        </div>
        <div class="filter-group">
            <label for="muscleGroup">운동 부위</label>
            <select id="muscleGroup" multiple>
                <option value="상체">상체</option>
                <option value="하체">하체</option>
                <option value="코어">코어</option>
                <option value="전신">전신</option>
            </select>
        </div>
        <button class="btn-search" onclick="validateAndFetch()">검색</button>
    </div>

    <div class="record-list" id="recordList"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    $(document).ready(function () {
        // 로그인/로그아웃 메뉴 렌더링
        renderAuthMenu();

        // 검색 버튼 클릭 시 유효성 검사 후 조회
        $(".btn-search").on("click", function () {
            validateAndFetch();
        });

        // 엔터 키로 검색
        $("#exerciseName").on("keypress", function (e) {
            if (e.which === 13) {
                e.preventDefault();
                validateAndFetch();
            }
        });
    });

    function isValidDateInput(dateStr) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
        const year = parseInt(dateStr.substring(0, 4));
        return year >= 1900 && year <= 2100;
    }

    function validateAndFetch() {
        const startDate = $("#startDate").val();
        const endDate = $("#endDate").val();

        if (startDate && !isValidDateInput(startDate)) {
            alert("시작일 연도는 1900~2100 사이의 4자리로 입력해주세요.");
            return;
        }
        if (endDate && !isValidDateInput(endDate)) {
            alert("종료일 연도는 1900~2100 사이의 4자리로 입력해주세요.");
            return;
        }

        fetchRecords(startDate, endDate);
    }

    async function fetchRecords(startDate, endDate) {
        const exerciseName = $("#exerciseName").val();
        const muscleGroup = $("#muscleGroup").val();  // 다중 선택

        const params = new URLSearchParams();
        if (startDate) params.append("startDate", startDate + "T00:00:00");
        if (endDate) params.append("endDate", endDate + "T23:59:59");
        if (exerciseName) params.append("exerciseName", exerciseName);
        if (muscleGroup && muscleGroup.length > 0) {
            muscleGroup.forEach(m => params.append("muscleGroup", m));
        }

        const token = localStorage.getItem("jwtToken");

        try {
            const res = await fetch(`/api/exercise-records?${params.toString()}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error("검색 실패");

            const data = await res.json();
            renderRecords(data.content || []);
        } catch (err) {
            alert("운동 기록을 불러오는데 실패했습니다.");
        }
    }

    function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString('ko-KR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'  // 요일 추가
        });
    }

    function renderRecords(records) {
        const list = $("#recordList");
        list.empty();

        if (records.length === 0) {
            list.html("<p>운동 기록이 없습니다.</p>");
            return;
        }

        records.forEach(record => {
            const card = $(`
                <div class="record-card">
                    <div class="record-info">
                        <div class="muscle">${record.muscleGroups}</div>
                        <div class="date">${formatDate(record.createdAt)}</div>
                    </div>
                </div>
            `);
            card.on("click", function () {
                window.location.href = `/exercise-record-detail/${record.exerciseRecordId}`;
            });
            list.append(card);
        });
    }
</script>
</body>
</html>
