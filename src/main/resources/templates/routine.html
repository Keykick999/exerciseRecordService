<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>루틴 생성</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }

        .navbar-nav .nav-link {
            color: #ffffff !important;
        }

        .navbar-nav .nav-link:hover {
            color: #ccccff !important;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 2rem;
            border-radius: 1rem;
            margin-top: 40px;
            max-width: 720px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        label, .form-label {
            color: #eeeeee;
            font-weight: 500;
        }

        .form-control {
            border-radius: 0.6rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control::placeholder {
            color: #cccccc;
        }

        .btn {
            border-radius: 0.6rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-danger {
            color: #ffffff;
            border-color: #888;
        }

        .btn-outline-primary:hover {
            background-color: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: #fff;
            border-color: #6c757d;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            color: #fff;
            border-color: #dc3545;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .set-number-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #cccccc;
        }

        .modal-content {
            border-radius: 1rem;
            background-color: #1e1e1e;
            color: white;
        }

        .modal-body {
            max-height: 60vh;
            overflow-y: auto;
        }


        .list-group-item {
            border-radius: 0.4rem;
            transition: background-color 0.2s;
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
        }

        .list-group-item:hover {
            background-color: #3a3a3a;
        }

        .form-check-label {
            color: #e0e0e0;
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

<!-- 네비게이션 바 -->
<div th:replace="fragments/navbar :: body"></div>

<!-- ✅ 본문 -->
<div class="container mt-5">
    <h2>운동 루틴 생성</h2>

    <div class="mb-3">
        <label for="routineNameInput" class="form-label">루틴 이름</label>
        <input type="text" class="form-control" id="routineNameInput" placeholder="예: 상체 루틴">
    </div>

    <button class="btn btn-outline-secondary mb-3" data-bs-toggle="modal" data-bs-target="#exerciseModal">운동 추가</button>
    <div id="routineSetsContainer"></div>
    <button id="saveRoutineBtn" class="btn btn-outline-primary mt-3 w-100 py-2">루틴 저장</button>
</div>

<!-- ✅ 운동 선택 모달 -->
<div class="modal fade" id="exerciseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">운동 선택</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <input type="text" class="form-control mb-2" id="exerciseSearchInput" placeholder="운동명 검색">
                    <div id="muscleGroupCheckboxes" class="d-flex flex-wrap gap-2"></div>
                    <button id="searchExerciseBtn" class="btn btn-outline-primary mt-2">검색</button>
                </div>
                <div class="list-group mt-3" id="exerciseList"></div>
                <div id="scrollSentinel" class="my-3 text-center">🔄 불러오는 중...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    const muscleGroupOptions = ["가슴", "등", "어깨", "하체", "복근", "이두", "삼두", "전신"];


    let currentPage = 0;
    let isLoading = false;
    let hasNext = true;

    function createMuscleCheckboxes() {
        const container = $('#muscleGroupCheckboxes');
        container.empty();
        muscleGroupOptions.forEach(muscle => {
            container.append(`
                <div class="form-check">
                    <input class="form-check-input muscle-checkbox" type="checkbox" value="${muscle}" id="muscle-${muscle}">
                    <label class="form-check-label" for="muscle-${muscle}">${muscle}</label>
                </div>
            `);
        });
    }

    function resetAndFetchExercises() {
        currentPage = 0;
        hasNext = true;
        $('#exerciseList').empty();
        fetchExercises();
    }

    function fetchExercises() {
        if (isLoading || !hasNext) return;
        isLoading = true;

        const name = $('#exerciseSearchInput').val();
        const muscles = $('.muscle-checkbox:checked').map(function () {
            return $(this).val();
        }).get();

        const requestData = {
            name,
            muscleGroup: muscles,
            page: currentPage,
            size: 10
        };

        console.log('🔍 요청 데이터:', requestData);  // 요청 확인용 로그

        $.ajax({
            url: '/api/exercise-types',
            method: 'GET',
            traditional: true,
            data: requestData,
            success: function (res) {
                const list = $('#exerciseList');
                res.content.forEach(ex => {
                    list.append(`
                    <button type="button" class="list-group-item list-group-item-action"
                        data-id="${ex.id}" data-name="${ex.name}">
                        ${ex.name} (${ex.muscleGroups.join(', ')})
                    </button>
                `);
                });
                hasNext = !res.last;
                if (res.last) {
                    $('#scrollSentinel').hide(); // 더 이상 로딩 안 함
                }
                currentPage++;
            },
            complete: function () {
                isLoading = false;
            }
        });
    }


    function addExerciseCard(exerciseId, exerciseName) {
        if ($(`[data-exercise-id="${exerciseId}"]`).length > 0) {
            alert('이미 추가된 운동입니다.');
            return;
        }

        const cardHtml = `
        <div class="card mb-3 routine-exercise" data-exercise-id="${exerciseId}">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="card-title">${exerciseName}</h5>
                    <button class="btn btn-outline-danger btn-sm remove-exercise" title="운동 삭제">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
                <div class="set-container">
                    <div class="row mb-2 set-row">
                        <div class="col-md-2 d-flex align-items-center">
                            <strong class="set-number-label">1세트</strong>
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control weight-input" placeholder="중량 (kg)" value="0">
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control reps-input" placeholder="반복 수" value="0">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-danger btn-sm w-100 remove-set-btn" title="세트 삭제">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-secondary add-set-btn mt-2">세트 추가</button>
            </div>
        </div>
    `;
        $('#routineSetsContainer').append(cardHtml);
    }

    function updateSetNumbers(container) {
        container.find('.set-row').each(function (index) {
            $(this).find('.set-number-label').text(`${index + 1}세트`);
        });
    }

    function addSetRow(container) {
        const setHtml = `
            <div class="row mb-2 set-row">
                <div class="col-md-2 d-flex align-items-center">
                    <strong class="set-number-label">1세트</strong>
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control weight-input" placeholder="중량 (kg)">
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control reps-input" placeholder="반복 수">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-danger btn-sm w-100 remove-set-btn" title="세트 삭제">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        `;
        container.append(setHtml);
    }

    $(document).ready(function () {
        renderAuthMenu();
        createMuscleCheckboxes();

        $('#searchExerciseBtn').on('click', resetAndFetchExercises);

        $('#exerciseSearchInput').on('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                $('#searchExerciseBtn').trigger('click');
            }
        });


        $('#exerciseList').on('click', 'button', function () {
            const id = $(this).data('id');
            const name = $(this).data('name');
            addExerciseCard(id, name);
            $('#exerciseModal').modal('hide');
        });

        $('#routineSetsContainer')
            .on('click', '.add-set-btn', function () {
                const container = $(this).siblings('.set-container');
                addSetRow(container);
                updateSetNumbers(container);
            })
            .on('click', '.remove-set-btn', function () {
                const container = $(this).closest('.set-container');
                $(this).closest('.set-row').remove();
                updateSetNumbers(container);
            })
            .on('click', '.remove-exercise', function () {
                $(this).closest('.routine-exercise').remove();
            });

        $('#saveRoutineBtn').on('click', function () {
            const routineName = $('#routineNameInput').val().trim();
            if (!routineName) {
                alert('루틴 이름을 입력해주세요.');
                return;
            }

            const routineSets = [];
            let hasInvalidInput = false;

            $('.routine-exercise').each(function () {
                const exerciseTypeId = $(this).data('exercise-id');
                const setRows = $(this).find('.set-row');

                // ✅ 세트가 없을 경우 기본 세트 1개 추가
                if (setRows.length === 0) {
                    routineSets.push({
                        exerciseTypeId,
                        setNumber: 1,
                        weight: 0,
                        repetitions: 0
                    });
                } else {
                    // ✅ 사용자가 입력한 세트 정보 수집
                    setRows.each(function (index) {
                        const weight = parseFloat($(this).find('.weight-input').val());
                        const repetitions = parseInt($(this).find('.reps-input').val());

                        // 세트 수나 반복 수 제대로 설정되어 있지 않으면
                        if (isNaN(weight) || isNaN(repetitions)) {
                            alert('모든 세트의 중량/반복 수를 입력해주세요.');
                            hasInvalidInput = true;
                            return false; // .each 중단
                        }

                        routineSets.push({
                            exerciseTypeId,
                            setNumber: index + 1,
                            weight,
                            repetitions
                        });
                    });


                    if (hasInvalidInput) {
                        return false; // routine-exercise.each 중단
                    }
                }
            });


            // 루틴 저장 중단
            if (hasInvalidInput) {
                return;
            }

            // 종목 추가 안된 상태
            if (routineSets.length === 0) {
                alert('운동을 한 개 이상 추가하고 세트를 입력해주세요.');
                return;
            }

            const requestBody = { name: routineName, routineSets };

            $.ajax({
                url: '/api/routines',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('jwtToken')}`
                },
                data: JSON.stringify(requestBody),
                success: function () {
                    alert('루틴이 성공적으로 저장되었습니다!');
                    window.location.href = '/routines';
                },
                error: function (xhr) {
                    if (xhr.status === 401 || xhr.status === 403) {
                        alert('로그인이 필요합니다.');
                        localStorage.removeItem('jwtToken');
                        window.location.href = '/login';
                    } else if (xhr.status === 400) {
                        alert('입력한 세트 정보가 유효하지 않습니다. 세트 번호, 중량, 반복 수를 확인하세요.');
                    } else if (xhr.status === 404) {
                        alert('선택한 운동 유형이 존재하지 않습니다.');
                    } else if (xhr.status === 409) {
                        alert('이미 존재하는 루틴 이름입니다. 다른 이름을 입력해주세요.');
                    } else {
                        alert('알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                        console.error(xhr);
                    }
                }
            });
        });

        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) {
                fetchExercises();
            }
        }, {
            root: document.querySelector('.modal-body'), // 정확하게 modal-body를 root로 지정
            threshold: 1.0
        });

        observer.observe(document.getElementById('scrollSentinel'));

    });
</script>
</body>
</html>
