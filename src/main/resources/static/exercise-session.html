<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 중</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 2rem;
            border-radius: 1rem;
            margin-top: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .exercise {
            background-color: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 0.75rem;
            margin-bottom: 10px;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        label {
            color: #cccccc;
        }

        .completed {
            background-color: rgba(25, 135, 84, 0.3) !important;
            opacity: 0.95;
        }

        .btn-outline-primary,
        .btn-success {
            border-radius: 0.5rem;
            font-weight: 500;
            color: #ffffff;
            border-color: #888;
            transition: 0.2s ease;
        }

        .btn-outline-primary:hover {
            background-color: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }

        .btn-success:hover {
            background-color: #198754;
            border-color: #198754;
        }

        .fixed-bottom-buttons {
            position: fixed;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 10px;
        }

        .bg-dark.bg-opacity-75 {
            background-color: rgba(0, 0, 0, 0.75) !important;
        }

        #timerOverlay h2,
        #timerOverlay #overlayTimerDisplay {
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);

        }

        #timerOverlay {
            background: url('/images/workout.png') no-repeat center center;
            background-size: cover; /* ← 핵심 변경 */
            background-color: black;  /* 남는 공간은 검정 처리 (optional) */
            background-position: center;
            background-repeat: no-repeat;

            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1060;
            color: white;
            overflow: hidden;
        }



        #timerOverlay::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.55); /* 어두운 그라디언트 효과 */
            z-index: -1;
        }

        .overlay-background {
            background: url('/images/workoutMotivation.jpeg') center center / cover no-repeat;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1060;
            color: white;
        }

        .overlay-background::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }
    </style>
</head>
<body>
<!-- ✅ 네비게이션 바 추가 -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px);">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-primary" href="/routines">🏋️ FitnessWeb</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="/routine">루틴 생성</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/routines">내 루틴</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/chat">운동 질문하기</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="/login">
                        <i class="bi bi-person-circle" style="font-size: 1.4rem;"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container my-5">
    <h2 id="routineTitle">루틴 상세 정보</h2>

    <!-- 운동 추가 버튼 -->
    <div class="text-end mb-3">
        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#exerciseModal">운동 추가</button>
    </div>

    <div id="detailContainer">로딩 중...</div>
</div>

<!-- 하단 완료 버튼 -->
<div class="fixed-bottom-buttons">
    <button class="btn btn-success" id="finishBtn">운동 완료</button>
</div>

<!-- 운동 선택 모달 -->
<div class="modal fade" id="exerciseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title">운동 선택</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control mb-2" id="exerciseSearchInput" placeholder="운동명 검색">
                <div id="muscleGroupCheckboxes" class="d-flex flex-wrap gap-2 mb-2"></div>
                <button id="searchExerciseBtn" class="btn btn-outline-light">검색</button>
                <div class="list-group mt-3" id="exerciseList"></div>
                <div id="scrollSentinel" class="my-3 text-center">
                    🔄 불러오는 중...
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ⏱ 왼쪽 하단 미니 타이머 버튼 -->
<div id="miniTimer" class="position-fixed bottom-0 start-0 m-3 bg-dark text-white px-3 py-2 rounded shadow" style="cursor:pointer; z-index: 1055;">
    <span id="miniTimerDisplay" class="fw-bold">00:00</span>
</div>

<!-- ⏱ 전체 화면 오버레이 타이머 모달 -->
<div id="timerOverlay" class="overlay-background d-none">
    <div class="d-flex flex-column justify-content-center align-items-center h-100">
        <h2 class="mb-4">휴식 타이머</h2>
        <div id="overlayTimerDisplay" class="display-3 fw-bold mb-4">00:00</div>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
            <button class="btn btn-outline-light time-btn" data-seconds="30">30초</button>
            <button class="btn btn-outline-light time-btn" data-seconds="60">1분</button>
            <button class="btn btn-outline-light time-btn" data-seconds="90">1분 30초</button>
            <button class="btn btn-outline-light time-btn" data-seconds="120">2분</button>
            <button class="btn btn-outline-light time-btn" data-seconds="150">2분 30초</button>
            <button class="btn btn-outline-light time-btn" data-seconds="180">3분</button>
            <button class="btn btn-outline-light time-btn" data-seconds="210">3분 30초</button>
            <button class="btn btn-outline-light time-btn" data-seconds="240">4분</button>
        </div>
        <div class="d-flex gap-3 mb-4">
            <button class="btn btn-success" id="startTimerBtn">시작</button>
            <button class="btn btn-danger" id="pauseTimerBtn">일시정지</button>
        </div>
        <button class="btn btn-light text-dark fw-bold px-4" id="closeTimerOverlay">닫기</button>
    </div>
</div>

<audio id="beepSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
<audio id="finishSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" preload="auto"></audio>

<div id="totalWorkoutTime"
     class="position-fixed top-0 start-50 translate-middle-x mt-3 px-4 py-2 bg-dark text-white fw-bold rounded shadow d-flex align-items-center gap-2"
     style="z-index: 2000;">
    ⏱ 전체 운동 시간: <span id="workoutTimeDisplay">00:00</span>
    <button id="pauseWorkoutBtn" class="btn btn-sm btn-light text-dark px-2 py-1">⏸</button>
    <button id="resumeWorkoutBtn" class="btn btn-sm btn-success px-2 py-1 d-none">▶️</button>
</div>
</body>

<script>
    let workoutStartTime = Date.now();
    let workoutPausedTime = 0; // 누적 일시정지 시간
    let workoutPausedStart = null;
    let workoutIsPaused = false;
    let workoutTimerInterval = null;
    const routineName = localStorage.getItem('activeRoutineName') || '알 수 없음';
    const routineData = JSON.parse(localStorage.getItem('activeRoutine') || '[]');
    let currentPage = 0;
    let isLoading = false;
    let hasNext = true;

    $('#routineTitle').text(`${routineName}`);

    const $container = $('#detailContainer');
    $container.empty();

    if (routineData.length === 0) {
        $container.html('<p>운동 세트 정보가 없습니다.</p>');
    } else {
        // 👉 1. 종목별로 그룹화
        const grouped = {};
        routineData.forEach((item, idx) => {
            if (!grouped[item.exerciseType]) {
                grouped[item.exerciseType] = [];
            }
            grouped[item.exerciseType].push({ ...item, index: idx });
        });

        // 👉 2. HTML 생성
        Object.entries(grouped).forEach(([exerciseType, sets]) => {
        const $groupBox = $(`
          <div class="mb-4 p-3 rounded bg-dark bg-opacity-75 exercise-group"
               data-exercise-type-id="${sets[0].exerciseTypeId}"
               data-exercise-type-name="${exerciseType}">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="text-white fw-bold mb-0">운동명: ${exerciseType}</h5>
              <div>
                <button class="btn btn-sm btn-outline-light add-set-btn">세트 추가</button>
                <button class="btn btn-sm btn-outline-danger remove-exercise-btn">종목 삭제</button>
              </div>
            </div>
            <div class="exercise-sets"></div>
          </div>
        `);


            sets.forEach((set, i) => {
                const $setRow = $(createSetRow(set.weight, set.repetitions));
                $groupBox.find('.exercise-sets').append($setRow);
            });
            $container.append($groupBox);
        });
    }

    $(document).on('input change', '.weight-input, .reps-input', function () {
        const $exercise = $(this).closest('.exercise');
        const $btn = $exercise.find('.complete-btn');

        if ($exercise.hasClass('completed')) {
            $exercise.removeClass('completed');
            $btn.text('세트 완료').removeClass('btn-success').addClass('btn-outline-primary');
        }
    });

    $('#finishBtn').on('click', function () {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }

        const updatedData = [];

        $('.exercise-group').each(function () {
            const exerciseTypeId = $(this).data('exercise-type-id');
            const exerciseType = $(this).data('exercise-type-name');

            $(this).find('.exercise.completed').each(function (idx) {
                const weight = parseFloat($(this).find('.weight-input').val());
                const repetitions = parseInt($(this).find('.reps-input').val());

                if (!isNaN(weight) && !isNaN(repetitions)) {
                    updatedData.push({
                        exerciseTypeId,
                        setOrder: idx + 1,
                        weight,
                        reps: repetitions
                    });
                }
            });
        });

        if (updatedData.length === 0) {
            alert('완료된 세트가 없습니다.');
            return;
        }

        $.ajax({
            url: '/api/exercise-records',
            method: 'POST',
            contentType: 'application/json',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            data: JSON.stringify(updatedData),
            success: function () {
                const elapsed = Math.floor((Date.now() - workoutStartTime - workoutPausedTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;

                const message = `전체 소요 시간: ${minutes}분 ${seconds}초`;
                const $notice = $('#workoutDurationNotice');
                $notice.text(message).fadeIn();

                setTimeout(() => {
                    $notice.fadeOut(() => {
                        localStorage.removeItem('activeRoutine');
                        localStorage.removeItem('activeRoutineName');
                        window.location.href = '/routines';
                    });
                }, 3000);

                alert('수고하셨습니다!');
                window.location.href='/routines';
            },
            error: function (xhr) {
                console.error('저장 실패:', xhr);
                alert('운동 기록 저장 실패');
            }
        });
    });

    const muscleGroupOptions = ["가슴", "등", "어깨", "하체", "복근", "팔"];

    function createMuscleCheckboxes() {
        const container = $('#muscleGroupCheckboxes');
        container.empty();
        muscleGroupOptions.forEach(muscle => {
            container.append(`
            <div class="form-check">
                <input class="form-check-input muscle-checkbox" type="checkbox" value="${muscle}" id="muscle-${muscle}">
                <label class="form-check-label" for="muscle-${muscle}">${muscle}</label>
            </div>
        `);
        });
    }

    function fetchExercises() {
        if (isLoading || !hasNext) return;
        isLoading = true;

        const name    = $('#exerciseSearchInput').val();
        const muscles = $('.muscle-checkbox:checked').map(function(){ return $(this).val() }).get();

        $.ajax({
            url: '/api/exercise-types',
            method: 'GET',
            traditional: true,
            data: {
                name,
                muscleGroup: muscles,  // 단수 key
                page: currentPage,
                size: 10
            },
            success(res) {
                const $list = $('#exerciseList');
                res.content.forEach(ex => {
                    $list.append(`
          <button class="list-group-item list-group-item-action"
                  data-id="${ex.id}" data-name="${ex.name}">
            ${ex.name} (${ex.muscleGroups.join(', ')})
          </button>
        `);
                });
                hasNext = !res.last;
                if (!hasNext) $('#scrollSentinel').hide();
                currentPage++;
            },
            complete() { isLoading = false; }
        });
    }


    function createSetRow(weight = 0, reps = 0) {
        return `
        <div class="exercise mb-2">
            <div class="row g-2 align-items-end">
                <div class="col-5">
                    <label class="form-label">중량 (kg)</label>
                    <input type="number" class="form-control weight-input" value="${weight}">
                </div>
                <div class="col-5">
                    <label class="form-label">반복 횟수</label>
                    <input type="number" class="form-control reps-input" value="${reps}">
                </div>
                <div class="col-1 d-flex align-items-end">
                    <button class="btn btn-outline-primary complete-btn w-100">세트 완료</button>
                </div>
                <div class="col-1 d-flex align-items-end">
                    <button class="btn btn-outline-danger remove-set-btn w-100">세트 삭제</button>
                </div>
            </div>
        </div>
    `;
    }



    function createExerciseGroup(exerciseId, exerciseName) {
        if ($(`[data-exercise-type-id="${exerciseId}"]`).length > 0) {
            alert("이미 추가된 운동입니다.");
            return;
        }

        const $groupBox = $(`
        <div class="mb-4 p-3 rounded bg-dark bg-opacity-75 exercise-group" data-exercise-type-id="${exerciseId}" data-exercise-type-name="${exerciseName}">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="text-white fw-bold mb-0">운동명: ${exerciseName}</h5>
                <div>
                    <button class="btn btn-sm btn-outline-light add-set-btn">세트 추가</button>
                    <button class="btn btn-sm btn-outline-danger remove-exercise-btn">종목 삭제</button>
                </div>
            </div>
            <div class="exercise-sets"></div>
        </div>
    `);
        $groupBox.find('.exercise-sets').append(createSetRow());
        $('#detailContainer').append($groupBox);
    }


    $(document).ready(function () {
        createMuscleCheckboxes();

        // Enter키로 검색 가능하게
        $('#exerciseSearchInput').on('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                $('#searchExerciseBtn').trigger('click');
            }
        });

        $('#searchExerciseBtn')
            .off('click')
            .on('click', () => {
                currentPage = 0;
                isLoading   = false;
                hasNext     = true;
                $('#exerciseList').empty();
                $('#scrollSentinel').show();
                fetchExercises();
            });



        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting) fetchExercises();
        }, {
            root: document.querySelector('.modal-body'),
            threshold: 1.0
        });
        observer.observe(document.getElementById('scrollSentinel'));

        fetchExercises();

        $('#exerciseList').on('click', 'button', function () {
            const id = $(this).data('id');
            const name = $(this).data('name');
            createExerciseGroup(id, name);
            $('#exerciseModal').modal('hide');
        });

        // 세트 추가
        $(document).on('click', '.add-set-btn', function () {
            $(this).closest('.exercise-group').find('.exercise-sets').append(createSetRow());
        });

        // 세트 삭제
        $(document).on('click', '.remove-set-btn', function () {
            $(this).closest('.exercise').remove();
        });

        // 종목 삭제
        $(document).on('click', '.remove-exercise-btn', function () {
            $(this).closest('.exercise-group').remove();
        });

        // 값 수정 시 완료 해제
        $(document).on('input change', '.weight-input, .reps-input', function () {
            const $exercise = $(this).closest('.exercise');
            $exercise.removeClass('completed');
            $exercise.find('.complete-btn').text('세트 완료').removeClass('btn-success').addClass('btn-outline-primary');
        });

        // ✅ 전체 운동 시간 측정 시작
        workoutTimerInterval = setInterval(updateWorkoutTimeDisplay, 1000);
    });

    // 중지 버튼
    $('#pauseWorkoutBtn').on('click', function () {
        if (!workoutIsPaused) {
            workoutIsPaused = true;
            workoutPausedStart = Date.now();  // 중지 시작 시각 저장
            clearInterval(workoutTimerInterval);
            $('#pauseWorkoutBtn').addClass('d-none');
            $('#resumeWorkoutBtn').removeClass('d-none');
        }
    });


    // 재시작 버튼
    $('#resumeWorkoutBtn').on('click', function () {
        if (workoutIsPaused) {
            workoutIsPaused = false;

            // 누적 일시정지 시간 += 이번 중지 시간
            workoutPausedTime += Date.now() - workoutPausedStart;
            workoutPausedStart = null;

            workoutTimerInterval = setInterval(updateWorkoutTimeDisplay, 1000);
            $('#resumeWorkoutBtn').addClass('d-none');
            $('#pauseWorkoutBtn').removeClass('d-none');
        }
    });

    function updateWorkoutTimeDisplay() {
        if (!workoutIsPaused) {
            const now = Date.now();
            const elapsed = Math.floor((now - workoutStartTime - workoutPausedTime) / 1000);
            const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const sec = String(elapsed % 60).padStart(2, '0');
            $('#workoutTimeDisplay').text(`${min}:${sec}`);
        }
    }


    let timerInterval = null;
    let remainingSeconds = 0;

    // 공통 시간 표시
    function formatTime(seconds) {
        const min = String(Math.floor(seconds / 60)).padStart(2, '0');
        const sec = String(seconds % 60).padStart(2, '0');
        return `${min}:${sec}`;
    }

    function updateAllTimerDisplays() {
        $('#miniTimerDisplay').text(formatTime(remainingSeconds));
        $('#overlayTimerDisplay').text(formatTime(remainingSeconds));
    }

    // 타이머 동작
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            if (remainingSeconds > 0) {
                remainingSeconds--;

                // 🔔 3초, 2초, 1초일 때 짧은 삐 소리 재생
                if (remainingSeconds <= 3 && remainingSeconds > 0) {
                    document.getElementById('beepSound').play();
                }

                updateAllTimerDisplays();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;

                // 🔊 타이머 종료 시 효과음 재생
                document.getElementById('finishSound').play();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // 미니 타이머 클릭 → 전체 오버레이 열기
    $('#miniTimer').on('click', function () {
        $('#timerOverlay').removeClass('d-none');
    });

    // 닫기 버튼
    $('#closeTimerOverlay').on('click', function () {
        $('#timerOverlay').addClass('d-none');
    });

    // 시간 버튼 클릭 시
    $('.time-btn').on('click', function () {
        remainingSeconds = parseInt($(this).data('seconds'));
        updateAllTimerDisplays();
    });

    // 시작/정지 버튼
    $('#startTimerBtn').on('click', startTimer);
    $('#pauseTimerBtn').on('click', pauseTimer);

    // ✅ 세트 완료 시 자동 타이머 설정
    $(document).on('click', '.complete-btn', function () {
        const $exercise = $(this).closest('.exercise');
        const isCompleted = $exercise.hasClass('completed');

        if (isCompleted) {
            $exercise.removeClass('completed');
            $(this).text('세트 완료').removeClass('btn-success').addClass('btn-outline-primary');
        } else {
            $exercise.addClass('completed');
            $(this).text('완료됨').removeClass('btn-outline-primary').addClass('btn-success');

            remainingSeconds = 60;
            updateAllTimerDisplays();
            startTimer();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
