<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 중</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 80px; }
        .exercise {
            padding: 20px;
            margin-bottom: 15px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .fixed-bottom-buttons {
            position: fixed;
            bottom: 20px;
            right: 30px;
        }
        .completed {
            background-color: #d4edda !important;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <h2 id="routineTitle" class="mb-4">루틴 상세 정보</h2>
    <div id="detailContainer">로딩 중...</div>
</div>

<!-- 하단 완료 버튼 -->
<div class="fixed-bottom-buttons">
    <button class="btn btn-success" id="finishBtn">운동 완료</button>
</div>

<script>
    const routineName = localStorage.getItem('activeRoutineName') || '알 수 없음';
    const routineData = JSON.parse(localStorage.getItem('activeRoutine') || '[]');

    $('#routineTitle').text(`${routineName}`);

    const $container = $('#detailContainer');
    if (routineData.length === 0) {
        $container.html('<p>운동 세트 정보가 없습니다.</p>');
    } else {
        $container.empty();
        routineData.forEach(function (item, index) {
            const html = `
                <div class="exercise" data-index="${index}">
                    <p><strong>운동명:</strong> ${item.exerciseType}</p>
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">중량 (kg)</label>
                            <input type="number" class="form-control weight-input" value="${item.weight}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">반복 횟수</label>
                            <input type="number" class="form-control reps-input" value="${item.repetitions}">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-outline-primary complete-btn w-100">세트 완료</button>
                        </div>
                    </div>
                </div>
            `;
            $container.append(html);
        });
    }

    // ✔ 세트 완료 토글 처리
    $(document).on('click', '.complete-btn', function () {
        const $exercise = $(this).closest('.exercise');
        const isCompleted = $exercise.hasClass('completed');

        if (isCompleted) {
            $exercise.removeClass('completed');
            $(this).text('세트 완료').removeClass('btn-success').addClass('btn-outline-primary');
        } else {
            $exercise.addClass('completed');
            $(this).text('완료됨').removeClass('btn-outline-primary').addClass('btn-success');
        }
    });

    // ✔ 입력값 변경 시 완료 상태 해제
    $(document).on('input change', '.weight-input, .reps-input', function () {
        const $exercise = $(this).closest('.exercise');
        const $btn = $exercise.find('.complete-btn');

        if ($exercise.hasClass('completed')) {
            $exercise.removeClass('completed');
            $btn.text('세트 완료').removeClass('btn-success').addClass('btn-outline-primary');
        }
    });

    // 운동 완료 버튼 → 완료된 세트만 전송
    $('#finishBtn').on('click', function () {
        const token = localStorage.getItem('jwtToken');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }

        const updatedData = [];

        $('#detailContainer .exercise.completed').each(function (idx) {
            const index = $(this).data('index');
            const original = routineData[index];

            const weight = parseFloat($(this).find('.weight-input').val());
            const repetitions = parseInt($(this).find('.reps-input').val());

            updatedData.push({
                exerciseTypeId: original.exerciseTypeId,
                setOrder: idx + 1,
                weight: weight,
                reps: repetitions
            });
        });

        if (updatedData.length === 0) {
            alert('완료된 세트가 없습니다.');
            return;
        }

        $.ajax({
            url: '/api/exercise-records',
            method: 'POST',
            contentType: 'application/json',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            data: JSON.stringify(updatedData),
            success: function () {
                alert('운동 기록이 저장되었습니다!');
                localStorage.removeItem('activeRoutine');
                localStorage.removeItem('activeRoutineName');
                window.location.href = '/routines';
            },
            error: function (xhr) {
                console.error('저장 실패:', xhr);
                alert('운동 기록 저장 실패');
            }
        });
    });
</script>
</body>
</html>
